exclude: >-
  (?x)(
    (^|/)(build|core-build|cmake-build-[^/]+|\.venv|venv|dist|wheels)/
    | (^|/)(aten\.gen\.cc|_tvm_ffi_ops_gen\.py)/?$
  )

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks:
      - id: ruff-check
        args: [--fix]
        types_or: [python, pyi]
      - id: ruff-format
        types_or: [python, pyi]
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v23.1.5
    hooks:
      - id: clang-format
        args: [--style=LLVM]
        files: \.(c|cc|cpp|cxx|h|hh|hpp|hxx)$
        types_or: [c, c++]
